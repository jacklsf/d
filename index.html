  <style>
    :root {
      --bg: #070808;
      --bg-soft: #0c0e0d;
      --panel: rgba(255,255,255,.045);
      --panel-2: rgba(255,255,255,.025);
      --line: rgba(255,255,255,.10);

      --text: #f5f2e9;
      --muted: #999d98;

      --gold: #d7b66d;
      --gold-light: #f0d99c;
      --green: #1e9f65;
      --green-dark: #147348;

      --container: 1240px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 72% 35%,
          rgba(20, 115, 72, .11),
          transparent 31%
        ),
        #070808;
      color: var(--text);
      font-family: "DM Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      width: min(calc(100% - 48px), var(--container));
      margin: 0 auto;
    }

    /* ---------------- HEADER ---------------- */

    .header {
      position: absolute;
      z-index: 20;
      top: 0;
      left: 0;
      width: 100%;
      padding: 30px 0;
    }

    .header__inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      font-family: "Manrope", sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .brand__mark {
      position: relative;
      width: 31px;
      height: 31px;
      border: 1px solid rgba(215,182,109,.7);
      border-radius: 50%;
    }

    .brand__mark::before {
      content: "♠";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--gold-light);
      font-size: 15px;
    }

    .header__right {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .online {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #aeb3ad;
      font-size: 12px;
      letter-spacing: .04em;
    }

    .online__dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #38ca82;
      box-shadow: 0 0 14px rgba(56,202,130,.7);
    }

    .header__cta {
      padding: 11px 18px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 999px;
      color: #dddcd7;
      font-size: 12px;
      transition: .25s ease;
    }

    .header__cta:hover {
      border-color: rgba(215,182,109,.55);
      color: #fff;
      background: rgba(215,182,109,.06);
    }

    /* ---------------- HERO ---------------- */

    .hero {
      position: relative;
      min-height: 100svh;
      display: flex;
      align-items: center;
      padding: 150px 0 80px;
      isolation: isolate;
    }

    .hero::before {
      content: "";
      position: absolute;
      z-index: -3;
      inset: 0;
      background:
        linear-gradient(
          90deg,
          rgba(7,8,8,1) 0%,
          rgba(7,8,8,.98) 32%,
          rgba(7,8,8,.60) 60%,
          rgba(7,8,8,.9) 100%
        );
    }

    .hero__noise {
      position: absolute;
      z-index: -1;
      inset: 0;
      opacity: .055;
      pointer-events: none;
      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
    }

    .hero__layout {
      display: grid;
      grid-template-columns: minmax(0, .93fr) minmax(400px, 1.07fr);
      align-items: center;
      gap: 50px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 27px;
      color: var(--gold);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 31px;
      height: 1px;
      background: var(--gold);
    }

    h1 {
      max-width: 680px;
      font-family: "Manrope", sans-serif;
      font-size: clamp(58px, 6.2vw, 92px);
      line-height: .96;
      font-weight: 500;
      letter-spacing: -.055em;
    }

    h1 span {
      display: block;
      color: var(--gold-light);
    }

    .hero__copy {
      max-width: 535px;
      margin-top: 31px;
      color: #a6aaa5;
      font-size: 17px;
      line-height: 1.72;
    }

    .hero__copy strong {
      color: #e6e4dd;
      font-weight: 500;
    }

    .hero__actions {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-top: 39px;
    }

    .primary-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      min-height: 58px;
      padding: 0 29px;
      overflow: hidden;
      border-radius: 4px;
      background:
        linear-gradient(135deg, #e0c17d, #b9944d);
      color: #0b0b09;
      font-family: "Manrope", sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .04em;
      box-shadow:
        0 14px 45px rgba(190,151,76,.13),
        inset 0 1px rgba(255,255,255,.4);
      transition:
        transform .25s ease,
        box-shadow .25s ease;
    }

    .primary-btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 18px 50px rgba(190,151,76,.22),
        inset 0 1px rgba(255,255,255,.5);
    }

    .primary-btn svg {
      width: 17px;
      height: 17px;
    }

    .secure-note {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #727771;
      font-size: 11px;
      line-height: 1.4;
    }

    .secure-note svg {
      width: 14px;
      opacity: .7;
    }

    /* ---------------- POKER VISUAL ---------------- */

    .visual {
      position: relative;
      height: 570px;
    }

    .visual__glow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 430px;
      height: 430px;
      transform: translate(-45%, -47%);
      border-radius: 50%;
      background: rgba(16,118,71,.15);
      filter: blur(80px);
    }

    .table {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 580px;
      height: 350px;
      transform:
        translate(-48%, -45%)
        perspective(900px)
        rotateX(57deg)
        rotateZ(-7deg);
      border: 10px solid #171a18;
      border-radius: 50%;
      background:
        radial-gradient(
          ellipse at 50% 45%,
          #174e39 0%,
          #103d2c 47%,
          #0b2c20 100%
        );
      box-shadow:
        0 0 0 2px rgba(215,182,109,.20),
        0 55px 75px rgba(0,0,0,.65),
        inset 0 0 70px rgba(0,0,0,.35);
    }

    .table::before {
      content: "";
      position: absolute;
      inset: 27px;
      border: 1px solid rgba(215,182,109,.16);
      border-radius: inherit;
    }

    .table__line {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 210px;
      height: 80px;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 10px;
    }

    .card {
      position: absolute;
      z-index: 3;
      width: 102px;
      height: 145px;
      padding: 10px;
      border-radius: 8px;
      background:
        linear-gradient(145deg, #faf8f1, #d9d6cd);
      color: #121313;
      font-family: Georgia, serif;
      box-shadow: 0 18px 30px rgba(0,0,0,.45);
    }

    .card__rank {
      font-size: 27px;
      line-height: .9;
    }

    .card__suit {
      margin-top: 3px;
      font-size: 20px;
    }

    .card__big {
      position: absolute;
      right: 13px;
      bottom: 9px;
      font-size: 46px;
      opacity: .92;
    }

    .card--1 {
      top: 174px;
      left: 202px;
      transform: rotate(-14deg);
    }

    .card--2 {
      z-index: 4;
      top: 160px;
      left: 270px;
      transform: rotate(3deg);
    }

    .chip {
      position: absolute;
      z-index: 5;
      width: 74px;
      height: 74px;
      border: 6px dashed rgba(255,255,255,.82);
      border-radius: 50%;
      box-shadow:
        0 10px 22px rgba(0,0,0,.4),
        inset 0 0 0 6px rgba(0,0,0,.2);
    }

    .chip::after {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 50%;
    }

    .chip--green {
      right: 74px;
      bottom: 106px;
      background: #18734d;
      transform: rotate(16deg);
    }

    .chip--dark {
      right: 127px;
      bottom: 63px;
      background: #171918;
      border-color: #c3a25c;
      transform: scale(.83);
    }

    .chip--gold {
      right: 29px;
      bottom: 62px;
      background: #9c793b;
      border-color: #e2c981;
      transform: scale(.68);
    }

    .visual__label {
      position: absolute;
      right: 0;
      bottom: 28px;
      display: flex;
      align-items: center;
      gap: 13px;
      color: #777c76;
      font-size: 10px;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .visual__label::before {
      content: "";
      width: 38px;
      height: 1px;
      background: rgba(215,182,109,.45);
    }

    /* ---------------- STATS ---------------- */

    .stats {
      position: absolute;
      bottom: 35px;
      left: 50%;
      width: min(calc(100% - 48px), var(--container));
      transform: translateX(-50%);
      display: flex;
      gap: 50px;
      padding-top: 24px;
      border-top: 1px solid rgba(255,255,255,.08);
    }

    .stat {
      min-width: 135px;
    }

    .stat__title {
      margin-bottom: 5px;
      color: #d6d5cf;
      font-family: "Manrope", sans-serif;
      font-size: 13px;
      font-weight: 600;
    }

    .stat__text {
      color: #666b66;
      font-size: 10px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    /* ---------------- MOBILE ---------------- */

    @media (max-width: 980px) {
      .hero {
        min-height: auto;
        padding-top: 145px;
        padding-bottom: 80px;
      }

      .hero__layout {
        grid-template-columns: 1fr;
        gap: 15px;
      }

      .hero__content {
        position: relative;
        z-index: 5;
      }

      .visual {
        height: 410px;
        margin-top: -5px;
      }

      .table {
        width: 510px;
        height: 305px;
      }

      .card--1 {
        top: 112px;
        left: calc(50% - 100px);
      }

      .card--2 {
        top: 101px;
        left: calc(50% - 31px);
      }

      .chip--green {
        right: 17%;
        bottom: 50px;
      }

      .chip--dark {
        right: 27%;
        bottom: 20px;
      }

      .chip--gold {
        right: 9%;
        bottom: 15px;
      }

      .stats {
        position: relative;
        bottom: auto;
        left: auto;
        width: 100%;
        transform: none;
        margin-top: 15px;
      }
    }
